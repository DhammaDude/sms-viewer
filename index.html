<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SMS Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #888;
    --sent: #2563eb;
    --received: #2a2a2a;
    --accent: #3b82f6;
    --search-bg: #111;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Drop zone ── */
  #drop-zone {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    height: 100dvh;
    border: 2px dashed var(--border);
    border-radius: 16px;
    margin: 24px;
    cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  #drop-zone.drag-over { border-color: var(--accent); background: rgba(59,130,246,.05); }
  #drop-zone svg { opacity: .4; }
  #drop-zone h2 { font-size: 20px; font-weight: 600; }
  #drop-zone p { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.6; }
  #drop-zone .hint { font-size: 12px; color: #555; margin-top: -8px; }
  #file-btn {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer;
    transition: opacity .15s;
  }
  #file-btn:hover { opacity: .85; }
  #file-input { display: none; }

  /* ── Loading ── */
  #loading {
    position: fixed; inset: 0; background: rgba(0,0,0,.75);
    display: none; align-items: center; justify-content: center;
    z-index: 99; flex-direction: column; gap: 14px; font-size: 15px;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-sub { font-size: 12px; color: var(--muted); }

  /* ── App shell ── */
  #app { display: none; flex: 1; overflow: hidden; flex-direction: row; }
  #app.visible { display: flex; }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px; min-width: 220px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header { padding: 16px 16px 8px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  #stats { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  #search {
    width: 100%; background: var(--search-bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  #contact-list { flex: 1; overflow-y: auto; padding: 4px 0; }

  .contact-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; cursor: pointer; transition: background .12s;
    border-left: 3px solid transparent;
  }
  .contact-item:hover { background: var(--surface); }
  .contact-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; background: var(--surface2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0; color: var(--accent);
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contact-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .contact-meta { font-size: 11px; color: var(--muted); white-space: nowrap; text-align: right; }
  .badge { background: var(--accent); color: #fff; border-radius: 10px; font-size: 11px; font-weight: 700; padding: 1px 7px; margin-top: 3px; display: inline-block; }

  /* ── Thread panel ── */
  #thread-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #thread-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  #thread-header .avatar { width: 34px; height: 34px; font-size: 13px; }
  #thread-title { font-weight: 700; font-size: 15px; }
  #thread-subtitle { font-size: 12px; color: var(--muted); }
  #thread-count { margin-left: auto; font-size: 12px; color: var(--muted); }
  #thread-search-bar { padding: 8px 16px; border-bottom: 1px solid var(--border); }
  #thread-search {
    width: 100%; background: var(--search-bg); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 6px 12px; font-size: 13px; outline: none;
  }
  #thread-search:focus { border-color: var(--accent); }
  #messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }

  .date-divider { text-align: center; font-size: 11px; color: var(--muted); margin: 12px 0 4px; letter-spacing: .04em; }
  .msg-row { display: flex; flex-direction: column; max-width: 70%; }
  .msg-row.sent { align-self: flex-end; align-items: flex-end; }
  .msg-row.received { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 8px 13px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
  .sent .bubble { background: var(--sent); color: #fff; border-bottom-right-radius: 4px; }
  .received .bubble { background: var(--received); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble.highlight { outline: 2px solid #facc15; }
  .msg-time { font-size: 10px; color: var(--muted); margin-top: 2px; padding: 0 4px; }
  .msg-label { font-size: 10px; color: var(--muted); padding: 0 4px; margin-bottom: 2px; }

  #empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; color: var(--muted);
  }
  #empty-state svg { opacity: .3; }

  #thread-inner { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  #thread-inner.visible { display: flex; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div id="drop-zone">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
  </svg>
  <h2>SMS Viewer</h2>
  <p>For large files (&gt;500 MB), drag your XML onto <strong>start.bat</strong><br>to use the local server mode.</p>
  <p class="hint">For small files, use the button below.</p>
  <button id="file-btn">Choose File (small files)</button>
  <input type="file" id="file-input" accept=".xml" />
</div>

<div id="loading">
  <div class="spinner"></div>
  <span id="loading-msg">Loading…</span>
  <span id="loading-sub"></span>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>SMS Viewer</h1>
      <div id="stats"></div>
      <input type="text" id="search" placeholder="Search contacts…" autocomplete="off" />
    </div>
    <div id="contact-list"></div>
  </div>
  <div id="thread-panel">
    <div id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Select a conversation</span>
    </div>
    <div id="thread-inner">
      <div id="thread-header">
        <div class="avatar" id="th-avatar"></div>
        <div>
          <div id="thread-title"></div>
          <div id="thread-subtitle"></div>
        </div>
        <div id="thread-count"></div>
      </div>
      <div id="thread-search-bar">
        <input type="text" id="thread-search" placeholder="Search messages…" autocomplete="off" />
      </div>
      <div id="messages"></div>
    </div>
  </div>
</div>

<script>
// ── Mode detection ──────────────────────────────────────────────────────
const SERVER_MODE = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
const API = `http://127.0.0.1:7700`;

// ── State ───────────────────────────────────────────────────────────────
let threads = {};         // address → thread (standalone mode)
let contactIndex = [];    // sorted contact list (both modes)
let currentAddr = null;
let threadSearchTerm = '';

// ── DOM ─────────────────────────────────────────────────────────────────
const dropZone    = document.getElementById('drop-zone');
const fileInput   = document.getElementById('file-input');
const fileBtn     = document.getElementById('file-btn');
const appEl       = document.getElementById('app');
const loadingEl   = document.getElementById('loading');
const loadingMsg  = document.getElementById('loading-msg');
const loadingSub  = document.getElementById('loading-sub');
const contactList = document.getElementById('contact-list');
const statsEl     = document.getElementById('stats');
const searchEl    = document.getElementById('search');
const emptyState  = document.getElementById('empty-state');
const threadInner = document.getElementById('thread-inner');
const messagesEl  = document.getElementById('messages');
const thAvatar    = document.getElementById('th-avatar');
const threadTitle = document.getElementById('thread-title');
const threadSub   = document.getElementById('thread-subtitle');
const threadCount = document.getElementById('thread-count');
const threadSearch= document.getElementById('thread-search');

// ── Server mode (large files via node server.js) ────────────────────────
if (SERVER_MODE) {
  dropZone.style.display = 'none';
  loadingEl.style.display = 'flex';
  loadingMsg.textContent = 'Parsing your SMS backup…';
  pollServerStatus();
}

let _pollFailures = 0;
async function pollServerStatus() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    const status = await fetch(`${API}/status`, { signal: controller.signal }).then(r => r.json());
    clearTimeout(timeout);
    _pollFailures = 0;

    loadingMsg.textContent = `Parsing… ${status.progress}%`;
    loadingSub.textContent = `${status.contacts} contacts · ${status.messages.toLocaleString()} messages so far`;

    if (status.error) {
      loadingEl.style.display = 'none';
      alert('Server parse error: ' + status.error);
      return;
    }

    if (status.done) {
      await loadContactsFromServer();
    } else {
      setTimeout(pollServerStatus, 1200);
    }
  } catch(e) {
    _pollFailures++;
    if (_pollFailures >= 8) {
      loadingEl.style.display = 'none';
      alert('Lost connection to server. Check the terminal window is still open.');
      return;
    }
    // Transient timeout — retry silently
    setTimeout(pollServerStatus, 2000);
  }
}

async function loadContactsFromServer() {
  loadingMsg.textContent = 'Loading contacts…';
  contactIndex = await fetch(`${API}/contacts`).then(r => r.json());
  loadingEl.style.display = 'none';
  appEl.classList.add('visible');
  updateStats(contactIndex.length, contactIndex.reduce((s, c) => s + c.count, 0));
  renderContactList(contactIndex);
}

// ── Standalone mode (small files via FileReader) ────────────────────────
fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) loadFile(file);
});

async function loadFile(file) {
  const mb = (file.size / 1024 / 1024).toFixed(1);
  if (file.size > 200 * 1024 * 1024) {
    alert(`This file is ${mb} MB. Files over 200 MB may crash the browser tab.\n\nUse start.bat instead:\n  Drag your XML file onto start.bat`);
    return;
  }
  loadingEl.style.display = 'flex';
  loadingMsg.textContent = `Reading file… (${mb} MB)`;
  loadingSub.textContent = '';

  try {
    const text = await readFileInChunks(file);
    loadingMsg.textContent = 'Parsing messages…';
    await raf2();
    parseXML(text);
    dropZone.style.display = 'none';
    appEl.classList.add('visible');
  } catch(err) {
    alert('Error: ' + err.message);
  } finally {
    loadingEl.style.display = 'none';
  }
}

async function readFileInChunks(file) {
  const CHUNK = 32 * 1024 * 1024;
  const chunks = [];
  let offset = 0;
  while (offset < file.size) {
    const blob = file.slice(offset, offset + CHUNK);
    const text = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = e => res(e.target.result);
      r.onerror = ()  => rej(new Error('Read error at byte ' + offset));
      r.readAsText(blob, 'UTF-8');
    });
    chunks.push(text);
    offset += CHUNK;
    loadingMsg.textContent = `Reading… ${Math.min(100, Math.round((offset / file.size) * 100))}%`;
    await new Promise(r => setTimeout(r, 0));
  }
  return chunks.join('');
}

// ── XML parsing (standalone) ────────────────────────────────────────────
function parseXML(xmlStr) {
  threads = {};
  let total = 0;
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('Invalid XML');

  doc.querySelectorAll('sms').forEach(el => {
    const addr = normalizeAddr(el.getAttribute('address'));
    const name = cleanName(el.getAttribute('contact_name')) || addr;
    const t = getThread(addr, name);
    t.messages.push({
      type: el.getAttribute('type') === '2' ? 'sent' : 'received',
      body: el.getAttribute('body') || '',
      date: parseInt(el.getAttribute('date') || '0', 10),
      readableDate: el.getAttribute('readable_date') || '',
      kind: 'sms',
    });
    total++;
  });

  doc.querySelectorAll('mms').forEach(el => {
    const addr = normalizeAddr(el.getAttribute('address'));
    const name = cleanName(el.getAttribute('contact_name')) || addr;
    const t = getThread(addr, name);
    let body = '';
    el.querySelectorAll('part').forEach(p => {
      const ct = p.getAttribute('ct') || '';
      const text = p.getAttribute('text');
      if (ct === 'text/plain' && text && text !== 'null') body = body ? body + '\n' + text : text;
    });
    t.messages.push({
      type: el.getAttribute('m_type') === '128' ? 'sent' : 'received',
      body,
      date: parseInt(el.getAttribute('date') || '0', 10),
      readableDate: el.getAttribute('readable_date') || '',
      kind: 'mms',
    });
    total++;
  });

  Object.values(threads).forEach(t => {
    t.messages.sort((a, b) => a.date - b.date);
    t.lastDate = t.messages.at(-1)?.date || 0;
    t.lastBody = t.messages.at(-1)?.body || '';
    t.count = t.messages.length;
  });

  contactIndex = Object.values(threads).sort((a, b) => b.lastDate - a.lastDate);
  updateStats(contactIndex.length, total);
  renderContactList(contactIndex);
}

function getThread(addr, name) {
  if (!threads[addr]) threads[addr] = { address: addr, name, messages: [] };
  if (name && name !== addr) threads[addr].name = name;
  return threads[addr];
}

// ── Contact list ────────────────────────────────────────────────────────
function renderContactList(list) {
  const term = searchEl.value.toLowerCase();
  const filtered = term
    ? list.filter(t => t.name.toLowerCase().includes(term) || t.address.includes(term))
    : list;

  contactList.innerHTML = '';
  if (!filtered.length) {
    contactList.innerHTML = '<div style="padding:20px;text-align:center;color:#555;font-size:13px;">No contacts found</div>';
    return;
  }

  const frag = document.createDocumentFragment();
  filtered.forEach(t => {
    const div = document.createElement('div');
    div.className = 'contact-item' + (currentAddr === t.address ? ' active' : '');
    div.dataset.addr = t.address;
    const count = t.count ?? t.messages?.length ?? 0;
    div.innerHTML = `
      <div class="avatar">${nameInitials(t.name)}</div>
      <div class="contact-info">
        <div class="contact-name">${esc(t.name)}</div>
        <div class="contact-preview">${esc((t.lastBody || '').slice(0, 60) || '(media)')}</div>
      </div>
      <div class="contact-meta">
        <div>${t.lastDate ? shortDate(t.lastDate) : ''}</div>
        <div class="badge">${count.toLocaleString()}</div>
      </div>`;
    div.addEventListener('click', () => openThread(t.address, t.name));
    frag.appendChild(div);
  });
  contactList.appendChild(frag);
}

searchEl.addEventListener('input', () => renderContactList(contactIndex));

// ── Thread view ─────────────────────────────────────────────────────────
async function openThread(addr, name) {
  currentAddr = addr;
  document.querySelectorAll('.contact-item').forEach(el =>
    el.classList.toggle('active', el.dataset.addr === addr));

  emptyState.style.display = 'none';
  threadInner.classList.add('visible');

  thAvatar.textContent = nameInitials(name || addr);
  threadTitle.textContent = name || addr;
  threadSub.textContent = (addr !== name) ? addr : '';
  threadCount.textContent = '…';
  threadSearch.value = '';
  threadSearchTerm = '';
  messagesEl.innerHTML = '';

  let messages;
  if (SERVER_MODE) {
    threadCount.textContent = 'Loading…';
    const thread = await fetch(`${API}/thread/${encodeURIComponent(addr)}`).then(r => r.json());
    messages = thread.messages;
  } else {
    messages = threads[addr]?.messages || [];
  }

  threadCount.textContent = `${messages.length.toLocaleString()} messages`;
  renderMessages(messages);
}

threadSearch.addEventListener('input', async () => {
  if (!currentAddr) return;
  threadSearchTerm = threadSearch.value.toLowerCase();
  let messages;
  if (SERVER_MODE) {
    const thread = await fetch(`${API}/thread/${encodeURIComponent(currentAddr)}`).then(r => r.json());
    messages = thread.messages;
  } else {
    messages = threads[currentAddr]?.messages || [];
  }
  renderMessages(messages);
});

function renderMessages(messages) {
  messagesEl.innerHTML = '';
  const term = threadSearchTerm;
  const filtered = term ? messages.filter(m => (m.body || '').toLowerCase().includes(term)) : messages;

  let lastLabel = '';
  const frag = document.createDocumentFragment();
  filtered.forEach(msg => {
    const d = new Date(msg.date);
    const label = d.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    if (label !== lastLabel) {
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = label;
      frag.appendChild(div);
      lastLabel = label;
    }

    const row = document.createElement('div');
    row.className = `msg-row ${msg.type}`;

    if (msg.kind === 'mms') {
      const lbl = document.createElement('div');
      lbl.className = 'msg-label'; lbl.textContent = 'MMS';
      row.appendChild(lbl);
    }

    if (msg.body) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (term && msg.body.toLowerCase().includes(term) ? ' highlight' : '');
      bubble.textContent = msg.body;
      row.appendChild(bubble);
    }

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = msg.readableDate || d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    row.appendChild(time);

    frag.appendChild(row);
  });

  messagesEl.appendChild(frag);

  if (term && filtered.length) {
    threadCount.textContent = `${filtered.length} / ${messages.length.toLocaleString()} messages`;
    messagesEl.querySelector('.highlight')?.scrollIntoView({ block: 'center' });
  } else {
    threadCount.textContent = `${messages.length.toLocaleString()} messages`;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

// ── Utilities ────────────────────────────────────────────────────────────
function updateStats(contacts, messages) {
  statsEl.textContent = `${contacts.toLocaleString()} contacts · ${messages.toLocaleString()} messages`;
}

function normalizeAddr(addr) {
  if (!addr || addr === 'null') return 'Unknown';
  const c = addr.replace(/\s+/g, '');
  return c.replace(/^(\+?1)?(\d{10})$/, (_, _p, n) => '+1' + n) || c;
}

function cleanName(name) {
  if (!name || name === 'null' || name === '(Unknown)') return '';
  return name.trim();
}

function nameInitials(name) {
  const parts = (name || '?').replace(/[^a-zA-Z0-9\s]/g, '').trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (parts[0]?.[0] || '?').toUpperCase();
}

function shortDate(ts) {
  const d = new Date(ts), now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  if (diff < 7)  return d.toLocaleDateString(undefined, { weekday: 'short' });
  if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function raf2() {
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
}
</script>
</body>
</html>
