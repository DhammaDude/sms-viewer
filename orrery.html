<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #120e08;
    --bg-glow: #241a0d;
    --panel: #1b140c;
    --panel2: #241b10;
    --border: #55401f;
    --brass: #c9a54a;
    --brass-dim: #8a6a35;
    --ivory: #ece2c4;
    --ink: #211a10;
    --parchment: #e7ddc0;
    --muted: #9c8b66;
    --accent: #c46a3a;
    --danger: #a8402b;
    --input-bg: #0f0b06;
    --ctl-hover-bg: #34260f;
    --ctl-active-text: #241b10;
    --row-active-bg: #2c2011;
    --font-display: "Cinzel", "Cormorant Garamond", Georgia, serif;
    --font-heading: "Cormorant Garamond", Georgia, serif;
    --font-body: "Spectral", "Iowan Old Style", Georgia, serif;
  }

  :root[data-theme="light"] {
    --bg: #eef0f2;
    --bg-glow: #ffffff;
    --panel: #f8f9fa;
    --panel2: #e9ebee;
    --border: #c4cbd1;
    --brass: #55606b;
    --brass-dim: #7b848c;
    --ivory: #ffffff;
    --ink: #202427;
    --parchment: #2a2f34;
    --muted: #6b747c;
    --accent: #2f5f7a;
    --danger: #a8402b;
    --input-bg: #ffffff;
    --ctl-hover-bg: #dde1e5;
    --ctl-active-text: #ffffff;
    --row-active-bg: #e3e7ea;
  }

  body {
    background: radial-gradient(ellipse at 50% 0%, var(--bg-glow) 0%, var(--bg) 70%);
    color: var(--parchment);
    font-family: var(--font-body);
    font-size: 14px;
    height: 100dvh;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: 320px; min-width: 260px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--panel);
  }
  #sidebar-header { padding: 18px 18px 14px; border-bottom: 1px solid var(--border); }
  #sidebar-header h1 {
    font-family: var(--font-display); font-size: 17px; font-weight: 600;
    letter-spacing: .08em; color: var(--brass); text-transform: uppercase;
  }
  #sidebar-header .sub {
    font-family: var(--font-heading); font-style: italic; font-size: 13px;
    color: var(--muted); margin-top: 5px;
  }

  .controls { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .controls label {
    font-family: var(--font-display); font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .12em; display: block; margin-bottom: 4px;
  }
  .row { display: flex; gap: 8px; align-items: center; }
  input[type="date"], select {
    flex: 1; background: var(--input-bg); border: 1px solid var(--border); color: var(--parchment);
    padding: 6px 8px; border-radius: 4px; font-size: 13px; font-family: var(--font-body);
  }
  button.ctl {
    background: var(--panel2); border: 1px solid var(--border); color: var(--brass);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: var(--font-display);
    letter-spacing: .04em; transition: background .15s;
  }
  button.ctl:hover { background: var(--ctl-hover-bg); }
  button.ctl.active { background: var(--brass); color: var(--ctl-active-text); }
  #theme-toggle { font-family: var(--font-display); font-size: 11px; letter-spacing: .06em; }
  #datetime-readout { font-family: var(--font-body); font-size: 12px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }

  #planet-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .planet-row {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px; cursor: pointer;
    border-left: 3px solid transparent; transition: background .12s;
  }
  .planet-row:hover { background: var(--panel2); }
  .planet-row.active { background: var(--row-active-bg); border-left-color: var(--accent); }
  .p-glyph { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; border: 1px solid var(--border); }
  .p-info { flex: 1; min-width: 0; }
  .p-name { font-family: var(--font-heading); font-weight: 600; font-size: 15px; }
  .p-meta { font-family: var(--font-body); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .p-rx { font-family: var(--font-display); font-size: 10px; color: var(--danger); font-weight: 700; margin-left: 4px; }

  #detail-panel { border-top: 1px solid var(--border); padding: 14px 18px; font-size: 12px; color: var(--muted); min-height: 92px; }
  #detail-panel h3 { font-family: var(--font-heading); font-style: italic; color: var(--brass); font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  #detail-panel div { line-height: 1.7; font-variant-numeric: tabular-nums; }

  /* ── Main dial area ── */
  #main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; overflow: auto; padding: 20px; min-width: 0; min-height: 0; }
  #dial-wrap { position: relative; max-width: 100%; }
  /* Base display size matches the logical 940x1130 drawing space even
     though the backing pixel buffer is scaled up by devicePixelRatio --
     max-width/height-auto still shrink it responsively on narrow screens. */
  canvas#dial { display: block; width: 940px; max-width: 100%; height: auto; }

  /* "Fullscreen" is a CSS-only overlay (not the browser Fullscreen API,
     which needs a permission an embedded preview may not grant) -- it fixes
     dial-wrap over the whole viewport and lets the canvas scale to fill it,
     showing the whole watch face exactly as drawn, no cropping. */
  #dial-wrap.pseudo-fullscreen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    /* A dark theatrical backdrop, independent of the brass/steel case
       theme -- the steel theme's own --bg is near-white, which read as a
       blank void around the letterboxed dial rather than a display case. */
    background: radial-gradient(ellipse at 50% 50%, #241a0d 0%, #120e08 75%);
  }
  #dial-wrap.pseudo-fullscreen canvas#dial {
    width: 100%;
    height: 100%;
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;

    z-index: 300; align-items: center; justify-content: center; padding: 16px;
  }
  #json-modal-box {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    width: min(640px, 100%); max-height: 85vh; display: flex; flex-direction: column;
    padding: 14px; gap: 10px;
  }
  #json-modal-head { display: flex; align-items: center; justify-content: space-between; }
  #json-modal-title { color: var(--brass); font-weight: 700; font-size: 13px; word-break: break-all; }
  #json-modal-textarea {
    flex: 1; min-height: 240px; background: #0f0b06; border: 1px solid var(--border); color: var(--parchment);
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; padding: 10px; border-radius: 6px;
    resize: vertical; white-space: pre; overflow: auto;
  }
  #json-modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #json-modal-hint { font-size: 11px; color: var(--muted); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>

<body>

<div id="sidebar">
  <div id="sidebar-header">

        <select id="speed-select">
          <option value="86400000">1 day / sec</option>

          <option value="3155760000000">100 years / sec</option>

    </div>
    <div id="datetime-readout">—</div>

    <div>

        <button class="ctl" id="jump-lunar-eclipse-btn">Next Lunar Eclipse</button>
      </div>

        <button class="ctl" id="export-btn" title="Export the current date's full computed state">Export Snapshot</button>
        <button class="ctl" id="export-range-btn" title="Export a time series across a date range">Export Range</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="ctl" id="import-btn" title="Load a previously exported snapshot">Import JSON</button>
        <input type="file" id="import-input" accept="application/json,.json" style="display:none" />
      </div>
    </div>
  </div>

  <div id="planet-list"></div>

    <h3>Select a body</h3>
    <div>Click a planet on the dial or in the list to see its details.</div>
  </div>
</div>

<div id="main">
  <div id="dial-wrap">
    <canvas id="dial" width="940" height="1130" role="img" aria-label="Orrery dial showing the positions of the nine planets, moon phase, day-date, and Metonic cycle complications."></canvas>
  </div>
</div>

<div id="json-modal">
  <div id="json-modal-box">
    <div id="json-modal-head">
      <span id="json-modal-title">export.json</span>
      <button class="ctl" id="json-modal-close">✕</button>
    </div>
    <textarea id="json-modal-textarea" readonly></textarea>
    <div id="json-modal-actions">
      <button class="ctl" id="json-modal-copy">Copy to Clipboard</button>
      <button class="ctl" id="json-modal-download">Try Direct Download</button>
    </div>
    <div id="json-modal-hint">If Copy doesn't work either, tap-and-hold inside the text above to select it manually.</div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────
// Orbital elements (J2000 + rate per Julian century), Standish approximate
// heliocentric ecliptic Keplerian elements, valid ~1800-2050.
// a: AU, e: eccentricity, I/L/peri/node: degrees.
// ─────────────────────────────────────────────────────────────────────────
const PLANETS = [
  { name: 'Mercury', symbol: '☿', color: '#b7b0a2',
    a: 0.38709927, da: 0.00000037, e: 0.20563593, de: 0.00001906, I: 7.00497902, dI: -0.00594749,
    L: 252.25032350, dL: 149472.67411175, peri: 77.45779628, dperi: 0.16047689, node: 48.33076593, dnode: -0.12534081 },
  { name: 'Venus', symbol: '♀', color: '#e8c99b',
    a: 0.72333566, da: 0.00000390, e: 0.00677672, de: -0.00004107, I: 3.39467605, dI: -0.00078890,
    L: 181.97909950, dL: 58517.81538729, peri: 131.60246718, dperi: 0.00268329, node: 76.67984255, dnode: -0.27769418 },
  { name: 'Earth', symbol: '⊕', color: '#5b93d6',
    a: 1.00000261, da: 0.00000562, e: 0.01671123, de: -0.00004392, I: -0.00001531, dI: -0.01294668,
    L: 100.46457166, dL: 35999.37244981, peri: 102.93768193, dperi: 0.32327364, node: 0.0, dnode: 0.0 },
  { name: 'Mars', symbol: '♂', color: '#c1502e',
    a: 1.52371034, da: 0.00001847, e: 0.09339410, de: 0.00007882, I: 1.84969142, dI: -0.00813131,
    L: -4.55343205, dL: 19140.30268499, peri: -23.94362959, dperi: 0.44441088, node: 49.55953891, dnode: -0.29257343 },
  { name: 'Jupiter', symbol: '♃', color: '#d9a066',
    a: 5.20288700, da: -0.00011607, e: 0.04838624, de: -0.00013253, I: 1.30439695, dI: -0.00183714,
    L: 34.39644051, dL: 3034.74612775, peri: 14.72847983, dperi: 0.21252668, node: 100.47390909, dnode: 0.20469106 },
  { name: 'Saturn', symbol: '♄', color: '#e0c68c',
    a: 9.53667594, da: -0.00125060, e: 0.05386179, de: -0.00050991, I: 2.48599187, dI: 0.00193609,
    L: 49.95424423, dL: 1222.49362201, peri: 92.59887831, dperi: -0.41897216, node: 113.66242448, dnode: -0.28867794 },
  { name: 'Uranus', symbol: '⛢', color: '#7fd9d9',
    a: 19.18916464, da: -0.00196176, e: 0.04725744, de: -0.00004397, I: 0.77263783, dI: -0.00242939,
    L: 313.23810451, dL: 428.48202785, peri: 170.95427630, dperi: 0.40805281, node: 74.01692503, dnode: 0.04240589 },
  { name: 'Neptune', symbol: '♆', color: '#4f6fd1',
    a: 30.06992276, da: 0.00026291, e: 0.00859048, de: 0.00005105, I: 1.77004347, dI: 0.00035372,
    L: -55.12002969, dL: 218.45945325, peri: 44.96476227, dperi: -0.32241464, node: 131.78422574, dnode: -0.00508664 },
  { name: 'Pluto', symbol: '♇', color: '#a98cc9',
    a: 39.48211675, da: -0.00031596, e: 0.24882730, de: 0.00005170, I: 17.14001206, dI: 0.00004818,
    L: 238.92903833, dL: 145.20780515, peri: 224.06891629, dperi: -0.04062942, node: 110.30393684, dnode: -0.01183482 },
];

const ZODIAC = ['♈ Aries','♉ Taurus','♊ Gemini','♋ Cancer','♌ Leo','♍ Virgo','♎ Libra','♏ Scorpio','♐ Sagittarius','♑ Capricorn','♒ Aquarius','♓ Pisces'];

// The four Galilean moons of Jupiter, modeled the way Galileo himself saw
// them: circular orbits viewed edge-on (a good approximation, since their
// orbital planes sit close to Jupiter's equator, itself close to the
// ecliptic), so each moon's position projects onto a simple side-to-side
// wobble. Periods and orbital radii (in Jupiter radii) are real, measured
// values -- what's approximate is phase0, each moon's position at the
// J2000.0 reference epoch, which is a fixed illustrative alignment rather
// than a precision-ephemeris fit (the same level of approximation the rest
// of this app's Keplerian elements use for the planets themselves).
const GALILEAN_MOONS = [
  { name: 'Io',       period: 1.769138,  distR: 5.9,  phase0: 0.15, color: '#e8c15a' },
  { name: 'Europa',   period: 3.551181,  distR: 9.4,  phase0: 0.62, color: '#cbb7e0' },
  { name: 'Ganymede', period: 7.154553,  distR: 15.0, phase0: 0.08, color: '#d99a6c' },
  { name: 'Callisto', period: 16.689018, distR: 26.3, phase0: 0.41, color: '#8fb7c9' },
];

function galileanOffset(moon, JD) {
  const cycles = (JD - 2451545.0) / moon.period + moon.phase0;
  return Math.sin(cycles * 2 * Math.PI);
}

// ─────────────────────────────────────────────────────────────────────────
// Geocentric sky view -- Alt/Az of the planets and the brightest stars as
// actually seen from a given point on Earth, rather than the heliocentric
// top-down diagram the rest of the dial shows.
// ─────────────────────────────────────────────────────────────────────────

// The 16 brightest stars: [name, RA (hours, J2000), Dec (degrees, J2000), magnitude]
const STARS = [
  ['Sirius', 6.75, -16.72, -1.46],
  ['Canopus', 6.40, -52.70, -0.74],
  ['Arcturus', 14.27, 19.18, -0.05],
  ['Vega', 18.62, 38.78, 0.03],
  ['Capella', 5.28, 46.00, 0.08],
  ['Rigel', 5.24, -8.20, 0.13],
  ['Procyon', 7.65, 5.22, 0.34],
  ['Betelgeuse', 5.92, 7.41, 0.50],
  ['Altair', 19.85, 8.87, 0.76],
  ['Aldebaran', 4.60, 16.51, 0.85],
  ['Antares', 16.49, -26.43, 0.96],
  ['Spica', 13.42, -11.16, 0.97],
  ['Pollux', 7.76, 28.03, 1.14],
  ['Fomalhaut', 22.96, -29.62, 1.16],
  ['Deneb', 20.69, 45.28, 1.25],
  ['Regulus', 10.14, 11.97, 1.35],
];

const OBLIQUITY_DEG = 23.4393; // Earth's axial tilt, J2000 (treated as constant, same precision tier as the rest of this app)

// Geocentric ecliptic cartesian (planet minus Earth, in the heliocentric
// frame already computed elsewhere) -> equatorial RA/Dec, by rotating
// about the x-axis by the obliquity rather than going through an
// intermediate ecliptic-longitude/latitude step.
function geocentricEquatorial(planetPos, earthPos) {
  const gx = planetPos.x - earthPos.x;
  const gy = planetPos.y - earthPos.y;
  const gz = planetPos.z - earthPos.z;
  const eps = deg2rad(OBLIQUITY_DEG);
  const xEq = gx;
  const yEq = gy * Math.cos(eps) - gz * Math.sin(eps);
  const zEq = gy * Math.sin(eps) + gz * Math.cos(eps);
  const r = Math.sqrt(xEq * xEq + yEq * yEq + zEq * zEq);
  const raDeg = normDeg(rad2deg(Math.atan2(yEq, xEq)));
  const decDeg = rad2deg(Math.asin(zEq / r));
  return { raDeg, decDeg, dist: r };
}

// Greenwich Mean Sidereal Time (Meeus), converted to Local Sidereal Time
// with the observer's east-positive longitude.
function localSiderealTimeDeg(JD, lonDeg) {
  const T = (JD - 2451545.0) / 36525;
  let gmst = 280.46061837 + 360.98564736629 * (JD - 2451545.0) + 0.000387933 * T * T - (T * T * T) / 38710000;
  return normDeg(gmst + lonDeg);
}

// Equatorial RA/Dec -> local Alt/Az for an observer at latDeg, given the
// local sidereal time.
function altAzFromEq(raDeg, decDeg, latDeg, lstDeg) {
  const H = deg2rad(lstDeg - raDeg);
  const dec = deg2rad(decDeg), lat = deg2rad(latDeg);
  const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(H);
  const alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  let cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
  cosAz = Math.max(-1, Math.min(1, cosAz));
  let az = Math.acos(cosAz);
  if (Math.sin(H) > 0) az = 2 * Math.PI - az;
  return { altDeg: rad2deg(alt), azDeg: rad2deg(az) };
}

function crossVec(a, b) { return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x }; }
function dotVec(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
function altAzToVec(azDeg, altDeg) {
  const a = deg2rad(azDeg), h = deg2rad(altDeg);
  return { x: Math.cos(h) * Math.sin(a), y: Math.cos(h) * Math.cos(a), z: Math.sin(h) };
}

// Azimuthal-equidistant projection re-centered on an arbitrary look
// direction (centerAz/centerAlt), rather than always the zenith -- this is
// what makes panning the sky view around possible. Returns the angular
// distance from center (theta, radians) and the bearing around it; the
// caller turns that into screen (x,y) with its own radius-per-radian scale.
function projectSky(azDeg, altDeg, centerAzDeg, centerAltDeg) {
  const v = altAzToVec(azDeg, altDeg);
  const c = altAzToVec(centerAzDeg, centerAltDeg);
  const worldUp = { x: 0, y: 0, z: 1 };
  let right = crossVec(worldUp, c);
  const rightLen = Math.hypot(right.x, right.y, right.z);
  right = rightLen < 1e-6 ? { x: 1, y: 0, z: 0 } : { x: right.x / rightLen, y: right.y / rightLen, z: right.z / rightLen };
  const up2 = crossVec(c, right);
  const cosTheta = Math.max(-1, Math.min(1, dotVec(v, c)));
  const theta = Math.acos(cosTheta);
  const tx = v.x - c.x * cosTheta, ty = v.y - c.y * cosTheta, tz = v.z - c.z * cosTheta;
  const sR = tx * right.x + ty * right.y + tz * right.z;
  const sU = tx * up2.x + ty * up2.y + tz * up2.z;
  const bearing = Math.atan2(sR, sU);
  return { theta, bearing };
}

function starRadius(mag) { return Math.max(0.9, 3 - mag * 0.6); }

function deg2rad(d) { return d * Math.PI / 180; }
function rad2deg(r) { return r * 180 / Math.PI; }
function normDeg(x) { x = x % 360; return x < 0 ? x + 360 : x; }

function toJulianDate(date) { return date.getTime() / 86400000 + 2440587.5; }
function fromJulianDate(jd) { return new Date((jd - 2440587.5) * 86400000); }

const SYNODIC_MONTH = 29.530588853;
const NEW_MOON_REF_JD = 2451550.1; // 2000-01-06 18:14 UT, a known new moon

function moonPhaseAt(date) {
  const jd = toJulianDate(date);
  return (((jd - NEW_MOON_REF_JD) % SYNODIC_MONTH) + SYNODIC_MONTH) % SYNODIC_MONTH / SYNODIC_MONTH;
}

// Next date (after `fromDate`) at which the moon phase fraction equals
// targetPhase (0 = new, 0.5 = full) — exact via the fixed synodic period,
// no search needed.
function nextPhaseDate(fromDate, targetPhase) {
  const jd = toJulianDate(fromDate);
  let n = Math.ceil((jd - NEW_MOON_REF_JD) / SYNODIC_MONTH - targetPhase);
  let candidate = NEW_MOON_REF_JD + (n + targetPhase) * SYNODIC_MONTH;
  if (candidate <= jd + 0.01) candidate += SYNODIC_MONTH;
  return fromJulianDate(candidate);
}

// Mean longitude of the Moon's ascending node (regresses ~18.6yr / 360deg).
function moonNodeLongitude(date) {
  const D = toJulianDate(date) - 2451545.0;
  return normDeg(125.1228 - 0.0529538083 * D);
}

function angleSeparation(a, b) {
  const d = normDeg(a - b);
  return Math.min(d, 360 - d);
}

// Simplified eclipse-season check: an eclipse is possible when the Sun sits
// close to one of the Moon's two nodes AND the Moon is near new (solar) or
// full (lunar) at the same time. Real eclipse geometry is more intricate
// (limits vary with distance), but these are the standard textbook margins
// (~18.5deg solar, ~12deg lunar) astronomers use for a first-pass check.
function eclipseTypeAt(date, sunLon) {
  const node = moonNodeLongitude(date);
  const dist = Math.min(angleSeparation(sunLon, node), angleSeparation(sunLon, node + 180));
  const phase = moonPhaseAt(date);
  if (dist < 18.5 && (phase < 0.06 || phase > 0.94)) return 'solar';
  if (dist < 12 && phase > 0.44 && phase < 0.56) return 'lunar';
  return null;
}

// Steps forward through upcoming new-or-full moons (the only dates an
// eclipse can fall on) checking the node-distance condition at each,
// capped at ~5 years out so a long eclipse-free stretch can't hang the
// search. Pass a specific type ('solar' or 'lunar') to only consider that
// kind's phase (new for solar, full for lunar); omit it to find whichever
// comes first.
function findNextEclipse(fromDate, sunLonAt, wantType) {
  let d = fromDate;
  for (let i = 0; i < 130; i++) {
    let candidate;
    if (wantType === 'solar') candidate = nextPhaseDate(d, 0);
    else if (wantType === 'lunar') candidate = nextPhaseDate(d, 0.5);
    else {
      const nextNew = nextPhaseDate(d, 0), nextFull = nextPhaseDate(d, 0.5);
      candidate = nextNew < nextFull ? nextNew : nextFull;
    }
    const type = eclipseTypeAt(candidate, sunLonAt(candidate));
    if (type && (!wantType || type === wantType)) return { date: candidate, type };
    d = new Date(candidate.getTime() + 86400000);
  }
  return null;
}

function solveKepler(M, e) {
  let E = M;
  for (let i = 0; i < 60; i++) {
    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
    E -= dE;
    if (Math.abs(dE) < 1e-10) break;
  }
  return E;
}

// Heliocentric ecliptic position (AU) and ecliptic longitude (deg) at Julian-century T from J2000.
function heliocentric(el, T) {
  const a = el.a + el.da * T;
  const e = el.e + el.de * T;
  const I = deg2rad(el.I + el.dI * T);
  const L = normDeg(el.L + el.dL * T);
  const peri = normDeg(el.peri + el.dperi * T);
  const node = normDeg(el.node + el.dnode * T);

  let M = normDeg(L - peri);
  let Mrad = deg2rad(M);
  if (Mrad > Math.PI) Mrad -= 2 * Math.PI;

  const E = solveKepler(Mrad, e);
  const v = 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
  const r = a * (1 - e * Math.cos(E));
  const xp = r * Math.cos(v), yp = r * Math.sin(v);

  const om = deg2rad(peri - node); // argument of periapsis
  const Om = deg2rad(node);
  const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
  const cosom = Math.cos(om), sinom = Math.sin(om);
  const cosI = Math.cos(I), sinI = Math.sin(I);

  const x = (cosom * cosOm - sinom * sinOm * cosI) * xp + (-sinom * cosOm - cosom * sinOm * cosI) * yp;
  const y = (cosom * sinOm + sinom * cosOm * cosI) * xp + (-sinom * sinOm + cosom * cosOm * cosI) * yp;
  const z = (sinom * sinI) * xp + (cosom * sinI) * yp;

  const period = Math.sqrt(a * a * a); // years, Kepler's third law
  return { x, y, z, r, a, e, lon: normDeg(rad2deg(Math.atan2(y, x))), periodYears: period };
}

function zodiacSign(lonDeg) { return ZODIAC[Math.floor(normDeg(lonDeg) / 30) % 12]; }

// Sun's geocentric ecliptic longitude at an arbitrary date (Earth's own
// heliocentric longitude + 180deg) — used by the eclipse search, which
// needs to evaluate this at many candidate dates, not just currentDate.
function sunLonAtDate(date) {
  const T = (toJulianDate(date) - 2451545.0) / 36525;
  const earthEl = PLANETS.find(p => p.name === 'Earth');
  return normDeg(heliocentric(earthEl, T).lon + 180);
}

function toLocalDateInputValue(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

// Keeps the real-time clock ring's hands sweeping smoothly even while the
// orrery's own simulated date is paused (the play loop above already
// re-renders often enough to cover the playing case). drawTimeRing already
// computes hand angles from fractional seconds/milliseconds, so rendering
// every animation frame -- rather than once a second -- is what turns that
// into an actual smooth sweep instead of a once-a-second jump.
function clockLoop() {
  if (!playing) render();
  requestAnimationFrame(clockLoop);
}

function round(n, d = 6) { const k = 10 ** d; return Math.round(n * k) / k; }

function snapshotData(date) {
  const JD = toJulianDate(date);
  const T = (JD - 2451545.0) / 36525;
  const positions = {};
  PLANETS.forEach(p => { positions[p.name] = heliocentric(p, T); });
  const earth = positions['Earth'];
  const sunGeoLon = normDeg(earth.lon + 180);
  const moonPhase = moonPhaseAt(date);
  const metonicYear = ((date.getUTCFullYear() - 2000) % 19 + 19) % 19 + 1;

  const planets = PLANETS.map(p => {
    const pos = positions[p.name];
    const isEarth = p.name === 'Earth';
    const geoLon = isEarth ? sunGeoLon : normDeg(rad2deg(Math.atan2(pos.y - earth.y, pos.x - earth.x)));
    const distEarth = Math.sqrt((pos.x - earth.x) ** 2 + (pos.y - earth.y) ** 2 + (pos.z - earth.z) ** 2);
    return {
      name: p.name,
      symbol: p.symbol,
      heliocentric: { xAU: round(pos.x), yAU: round(pos.y), zAU: round(pos.z), distanceAU: round(pos.r), eclipticLongitudeDeg: round(pos.lon) },
      geocentric: { distanceAU: isEarth ? null : round(distEarth), longitudeDeg: round(geoLon), zodiacSign: zodiacSign(geoLon), retrograde: isEarth ? null : isRetrograde(p, T) },
      orbit: { semiMajorAxisAU: round(pos.a), eccentricity: round(pos.e, 4), periodYears: round(pos.periodYears, 4), periodDays: Math.round(pos.periodYears * 365.25) },
    };
  });

  return {
    date: date.toISOString(),
    julianDate: round(JD, 5),
    sun: { geocentricLongitudeDeg: round(sunGeoLon), zodiacSign: zodiacSign(sunGeoLon) },
    moon: { phase: round(moonPhase, 4), label: moonPhaseLabel(moonPhase) },
    metonicCycleYear: metonicYear,
    planets,
  };
}

      await navigator.clipboard.writeText(text);

    } catch {
      jsonModalTextarea.focus();

      jsonModalCopyBtn.textContent = ok ? 'Copied!' : 'Select all above, then copy';

  };
}

  const step = Math.max(1, parseInt(stepStr, 10) || 1);
  if (isNaN(start) || isNaN(end) || end < start) { alert('Invalid date range.'); return; }

  const points = Math.floor((end - start) / 86400000 / step) + 1;
  if (points > 5000) {
    alert(`That range would produce ${points.toLocaleString()} points — narrow the range or increase the step (max 5000).`);

  }

  const series = [];
  for (let t = start.getTime(); t <= end.getTime(); t += step * 86400000) {
    series.push(snapshotData(new Date(t)));
  }
  showJSONModal(series, `antikythera-series-${startStr}_to_${endStr}.json`);
});

// ─────────────────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────────────────
const CX = 470, CY = 430;
const R_MIN = 55, R_MAX = 340;
const AU_MIN = Math.sqrt(0.31), AU_MAX = Math.sqrt(49.5);

function scaleR(auDist) {
  const s = Math.sqrt(auDist);
  const t = Math.min(1, Math.max(0, (s - AU_MIN) / (AU_MAX - AU_MIN)));
  return R_MIN + t * (R_MAX - R_MIN);
}

// Deterministic PRNG (same seed -> same texture every render, no flicker).
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Subtle circular brushing -- fine concentric lathe-turning marks -- for a
// ring band. Streak ARC LENGTH (not angular span) is capped to a small,
// fixed pixel range regardless of radius, so marks stay short scratches
// rather than scaling into long, faintly-visible bands on a bigger ring.
// Each streak's radius is already confined to [rIn, rOut], so this needs
// no clipping.
function brushRing(c, cx, cy, rIn, rOut, seed) {
  const rnd = mulberry32(seed);
  const lines = Math.min(220, Math.max(120, Math.round((rOut - rIn) * (rIn + rOut) * 0.01)));
  const alpha = 0.05;
  for (let i = 0; i < lines; i++) {
    const r = rIn + rnd() * (rOut - rIn);
    const arcLen = 5 + rnd() * 14; // px, independent of the ring's own size
    const a0 = rnd() * Math.PI * 2;
    const span = arcLen / r;
    c.beginPath();
    c.arc(cx, cy, r, a0, a0 + span);
    c.strokeStyle = rnd() > 0.5
      ? `rgba(43,32,16,${(alpha * (0.5 + rnd() * 0.5)).toFixed(3)})`
      : `rgba(255,244,214,${(alpha * (0.5 + rnd() * 0.5)).toFixed(3)})`;
    c.lineWidth = 0.6;
    c.stroke();
  }
}

// Subtle satin/linear brushing for a flat plate. Streak length is a small,
// fixed pixel range regardless of the plate's own size (the earlier version
// scaled length with the bounding box width, which on the real shield --
// much wider than the mockup swatch it was tuned against -- produced
// streaks hundreds of pixels long: individually faint, but long enough to
// read as a stray line rather than fine grain). Assumes the caller has
// already clipped to the plate's own silhouette, since streaks are random
// line segments that would otherwise spill past an irregular outline.
function brushFlat(c, x, y, w, h, seed) {
  const rnd = mulberry32(seed);
  const lines = Math.min(320, Math.max(200, Math.round((w * h) / 900)));
  const alpha = 0.05;
  for (let i = 0; i < lines; i++) {
    const lx0 = x + rnd() * w;
    const ly = y + rnd() * h;
    const len = 8 + rnd() * 20; // px, independent of the plate's own size
    c.beginPath();
    c.moveTo(lx0, ly);
    c.lineTo(lx0 + len, ly + (rnd() - 0.5) * 1.5);
    c.strokeStyle = rnd() > 0.5
      ? `rgba(43,32,16,${(alpha * (0.5 + rnd() * 0.5)).toFixed(3)})`
      : `rgba(255,244,214,${(alpha * (0.5 + rnd() * 0.5)).toFixed(3)})`;
    c.lineWidth = 0.6;
    c.stroke();
  }
}

function drawGearRing(c, cx, cy, rIn, rOut, teeth, th) {
  c.save();
  c.translate(cx, cy);
  c.fillStyle = th.metalDark;
  for (let i = 0; i < teeth; i++) {
    const a0 = (i / teeth) * 2 * Math.PI;
    const a1 = a0 + (2 * Math.PI / teeth) * 0.55;
    c.beginPath();
    c.arc(0, 0, rOut, a0, a1);
    c.arc(0, 0, rIn, a1, a0, true);
    c.closePath();
    c.fill();
  }
  c.restore();
}

// Polished brass case ring with fine radial flutes, like a pocket-watch case back.
function drawFlutedRing(c, cx, cy, rIn, rOut, flutes, th) {
  c.save();
  c.translate(cx, cy);
  const bandGrad = c.createRadialGradient(0, 0, rIn, 0, 0, rOut);
  bandGrad.addColorStop(0, th.caseGradStops[0]);
  bandGrad.addColorStop(0.5, th.caseGradStops[1]);
  bandGrad.addColorStop(1, th.caseGradStops[2]);
  c.beginPath();
  c.arc(0, 0, rOut, 0, 2 * Math.PI);
  c.arc(0, 0, rIn, 0, 2 * Math.PI, true);
  c.fillStyle = bandGrad;
  c.fill('evenodd');
  brushRing(c, 0, 0, rIn, rOut, 11);
  for (let i = 0; i < flutes; i++) {
    const a = (i / flutes) * 2 * Math.PI;
    c.strokeStyle = i % 2 === 0 ? th.fluteDark : th.fluteLight;
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
    c.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
    c.stroke();
  }
  c.strokeStyle = th.metalDeepest; c.lineWidth = 2;
  c.beginPath(); c.arc(0, 0, rOut, 0, 2 * Math.PI); c.stroke();
  c.beginPath(); c.arc(0, 0, rIn, 0, 2 * Math.PI); c.stroke();
  c.restore();
}

// A genuine working clock — hour/minute/second markers confined to the case
// ring's own band (R_MAX+52..+68), so nothing crosses the planetary face.
// Clock angle convention (0=12 o'clock, clockwise) is converted to this
// dial's own (0=3 o'clock, counterclockwise) convention via a = 90 - theta.
function drawTimeRing(c, cx, cy, th) {
  const now = new Date();
  const h = now.getHours() % 12, m = now.getMinutes(), s = now.getSeconds(), ms = now.getMilliseconds();
  const secFrac = s + ms / 1000;
  const minFrac = m + secFrac / 60;
  const hourFrac = h + minFrac / 60;

  const rIn = R_MAX + 52, rOut = R_MAX + 76;
  c.save();
  c.translate(cx, cy);

  // a darker backing band makes the whole ring read as its own instrument,
  // not just texture on the case
  c.beginPath();
  c.arc(0, 0, rOut - 1, 0, 2 * Math.PI);
  c.arc(0, 0, rIn + 1, 0, 2 * Math.PI, true);
  c.fillStyle = 'rgba(0,0,0,0.16)';
  c.fill('evenodd');

  // 60 minute ticks, 12 of them bolder as hour marks, with cardinal numerals
  const ROMAN = { 0: 'XII', 3: 'III', 6: 'VI', 9: 'IX' };
  for (let i = 0; i < 60; i++) {
    const theta = i * 6;
    const a = deg2rad(90 - theta);
    const isHour = i % 5 === 0;
    const hourIdx = i / 5;
    const tickIn = isHour ? rOut - 11 : rOut - 4;
    c.beginPath();
    c.moveTo(Math.cos(a) * tickIn, -Math.sin(a) * tickIn);
    c.lineTo(Math.cos(a) * rOut, -Math.sin(a) * rOut);
    c.strokeStyle = isHour ? th.metalDeepest : th.metalDark;
    c.lineWidth = isHour ? 2.6 : 1.1;
    c.stroke();
    if (isHour && ROMAN[hourIdx] !== undefined) {
      c.fillStyle = th.metalDeepest;
      c.font = '600 9px Cinzel, serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText(ROMAN[hourIdx], Math.cos(a) * (rIn + 9), -Math.sin(a) * (rIn + 9));
    }
  }

  // hour marker — a bold filled wedge in Earth blue, unmistakable against
  // the thinner minute/second markers
  const EARTH_BLUE = '#5b93d6';
  const ah = deg2rad(90 - hourFrac * 30);
  const radial = { x: Math.cos(ah), y: -Math.sin(ah) };
  const tangent = { x: -Math.sin(ah), y: -Math.cos(ah) };
  const hBase = rIn + 2, hTip = rOut - 6, hHalfWidth = 4.2;
  c.beginPath();
  c.moveTo(radial.x * hBase + tangent.x * hHalfWidth, radial.y * hBase + tangent.y * hHalfWidth);
  c.lineTo(radial.x * hTip, radial.y * hTip);
  c.lineTo(radial.x * hBase - tangent.x * hHalfWidth, radial.y * hBase - tangent.y * hHalfWidth);
  c.closePath();
  c.fillStyle = EARTH_BLUE;
  c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 3; c.shadowOffsetX = 0.5; c.shadowOffsetY = 1;
  c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0;
  c.strokeStyle = th.metalDeepest; c.lineWidth = 0.75;
  c.stroke();

  // minute marker — Earth blue, slim, reaching further out
  const am = deg2rad(90 - minFrac * 6);
  c.beginPath();
  c.moveTo(Math.cos(am) * (rIn + 1), -Math.sin(am) * (rIn + 1));
  c.lineTo(Math.cos(am) * (rOut - 2), -Math.sin(am) * (rOut - 2));
  c.strokeStyle = EARTH_BLUE; c.lineWidth = 1.8; c.lineCap = 'round';
  c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 2.5; c.shadowOffsetX = 0.5; c.shadowOffsetY = 1;
  c.stroke();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0;

  // second marker — Earth blue too, thinner, sweeps continuously
  const as = deg2rad(90 - secFrac * 6);
  c.beginPath();
  c.moveTo(Math.cos(as) * (rIn + 1), -Math.sin(as) * (rIn + 1));
  c.lineTo(Math.cos(as) * (rOut - 1), -Math.sin(as) * (rOut - 1));
  c.strokeStyle = EARTH_BLUE; c.lineWidth = 1.2; c.lineCap = 'round';
  c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 2; c.shadowOffsetX = 0.5; c.shadowOffsetY = 0.75;
  c.stroke();
  c.beginPath(); c.arc(Math.cos(as) * (rIn + 1), -Math.sin(as) * (rIn + 1), 1.8, 0, 2 * Math.PI);
  c.fillStyle = EARTH_BLUE; c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0;

  c.lineCap = 'butt';
  c.restore();
}

// Text set along a circular arc, letter by letter — for engraved dial branding.
function drawArcText(c, cx, cy, radius, text, centerAngleDeg, spreadDeg, color, font) {
  c.save();
  c.translate(cx, cy);
  c.font = font;
  c.fillStyle = color;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  const n = text.length;
  const step = n > 1 ? deg2rad(spreadDeg) / (n - 1) : 0;
  const start = deg2rad(centerAngleDeg) + (n > 1 ? deg2rad(spreadDeg) / 2 : 0);
  for (let i = 0; i < n; i++) {
    const a = start - i * step;
    c.save();
    c.translate(Math.cos(a) * radius, -Math.sin(a) * radius);
    c.rotate(-a + Math.PI / 2);
    c.fillText(text[i], 0, 0);
    c.restore();
  }
  c.restore();
}

// The Galilean-moon complication: four small dots wobbling around Jupiter's
// own orbit ring, anchored to wherever Jupiter currently sits, rather than
// living on the shield. Uses this dial's own astronomical convention
// (x=cos(lon)*r, y=-sin(lon)*r) throughout, matching how Jupiter itself is
// drawn -- so the dots stay locked to Jupiter's real screen position as
// the simulation date changes, instead of a fixed spot on the case.
function drawGalileanStrip(c, cx, cy, jupiterPos, JD, th) {
  const rr = scaleR(jupiterPos.r);
  const lon = jupiterPos.lon;
  const span = 26; // degrees of ecliptic longitude the moons' wobble covers

  c.save();
  c.translate(cx, cy);

  const maxDist = GALILEAN_MOONS[GALILEAN_MOONS.length - 1].distR;
  GALILEAN_MOONS.forEach(m => {
    const off = galileanOffset(m, JD) * (m.distR / maxDist) * (span / 2) * 0.85;
    const a = deg2rad(lon + off);
    const x = Math.cos(a) * rr, y = -Math.sin(a) * rr;
    c.beginPath(); c.arc(x, y, 2.4, 0, 2 * Math.PI);
    c.fillStyle = m.color; c.fill();
    c.strokeStyle = th.metalDeepest; c.lineWidth = 0.6; c.stroke();
  });

  c.restore();
}

// Replaces the heliocentric orbit-rings/sun/planets content with what's
// actually visible from the observer's location right now: the brightest
// stars and the planets, converted through geocentric-equatorial and then
// local Alt/Az. Confined to radius R_MAX so it drops into the same "face"
// the orbit diagram normally occupies -- the case ring, zodiac ring, time
// ring and shield complications around it are unaffected either way.
function drawSkyView(c, cx, cy, JD, positions, earth, th) {
  c.save();
  c.translate(cx, cy);

  c.beginPath();
  c.arc(0, 0, R_MAX, 0, 2 * Math.PI);
  c.clip();

  const sky = c.createRadialGradient(0, -R_MAX * 0.2, R_MAX * 0.05, 0, 0, R_MAX);
  sky.addColorStop(0, '#16233a');
  sky.addColorStop(1, '#050810');
  c.beginPath(); c.arc(0, 0, R_MAX, 0, 2 * Math.PI); c.fillStyle = sky; c.fill();

  const lstDeg = localSiderealTimeDeg(JD, observerLoc.lon);
  const pxPerRad = R_MAX / (Math.PI / 2) * skyView.zoom;

  function toScreen(azDeg, altDeg) {
    const { theta, bearing } = projectSky(azDeg, altDeg, skyView.centerAz, skyView.centerAlt);
    const r = theta * pxPerRad;
    return { x: r * Math.sin(bearing), y: -r * Math.cos(bearing), r };
  }

  // stars
  STARS.forEach(([name, raH, decDeg, mag]) => {
    const { altDeg, azDeg } = altAzFromEq(raH * 15, decDeg, observerLoc.lat, lstDeg);
    if (altDeg < -2) return;
    const p = toScreen(azDeg, altDeg);
    if (p.r > R_MAX) return;
    c.beginPath(); c.arc(p.x, p.y, starRadius(mag), 0, 2 * Math.PI);
    c.fillStyle = '#f4efe0'; c.fill();
    if (mag < 0.5) {
      c.fillStyle = 'rgba(244,239,224,0.75)'; c.font = '9px "Cormorant Garamond", serif';
      c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillText(name, p.x + 5, p.y);
    }
  });

  // planets (skip Earth -- that's the observer)
  PLANETS.forEach(pl => {
    if (pl.name === 'Earth') return;
    const eq = geocentricEquatorial(positions[pl.name], earth);
    const { altDeg, azDeg } = altAzFromEq(eq.raDeg, eq.decDeg, observerLoc.lat, lstDeg);
    if (altDeg < -2) return;
    const p = toScreen(azDeg, altDeg);
    if (p.r > R_MAX) return;
    c.beginPath(); c.arc(p.x, p.y, pl.name === selected ? 9 : 7, 0, 2 * Math.PI);
    c.fillStyle = pl.color; c.fill();
    c.strokeStyle = pl.name === selected ? th.selectedStroke : th.defaultStroke;
    c.lineWidth = pl.name === selected ? 2.2 : 1.3;
    c.stroke();
    c.fillStyle = '#ece2c4'; c.font = '10px serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(pl.symbol, p.x, p.y + 0.5);
  });

  // compass points, projected the same way so they stay correct while panned
  [['N', 0], ['E', 90], ['S', 180], ['W', 270]].forEach(([label, az]) => {
    const p = toScreen(az, 0);
    if (p.r > R_MAX) return;
    c.fillStyle = 'rgba(201,165,74,0.8)'; c.font = '600 11px Cinzel, serif';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(label, p.x, p.y);
  });

  // zenith marker, only meaningful near it
  const zen = toScreen(skyView.centerAz, 90);
  if (Math.hypot(zen.x, zen.y) < R_MAX) {
    c.beginPath(); c.arc(zen.x, zen.y, 2, 0, 2 * Math.PI);
    c.strokeStyle = 'rgba(201,165,74,0.5)'; c.lineWidth = 1; c.stroke();
  }

  c.restore();
}

function render() {
  const JD = toJulianDate(currentDate);
  const T = (JD - 2451545.0) / 36525;

  const positions = {};
  PLANETS.forEach(p => { positions[p.name] = heliocentric(p, T); });
  const earth = positions['Earth'];
  const sunGeoLon = normDeg(earth.lon + 180);
  const sunSignIndex = Math.floor(sunGeoLon / 30) % 12;

  const th = theme();

  ctx.clearRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = th.caseBg;
  ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // polished case ring (outermost)
  drawFlutedRing(ctx, CX, CY, R_MAX + 52, R_MAX + 76, 140, th);

  // a real, ticking clock — hour/minute/second markers on the case ring's
  // own band, confined entirely to that band so nothing crosses the
  // planetary face itself
  drawTimeRing(ctx, CX, CY, th);

  // movement ring — gear teeth plus engraved dial branding
  drawGearRing(ctx, CX, CY, R_MAX + 34, R_MAX + 48, 96, th);
  drawArcText(ctx, CX, CY, R_MAX + 41, 'ANTIKYTHERA', 90, 56, th.brandText, '600 12px Cinzel, serif');
  drawArcText(ctx, CX, CY, R_MAX + 41, 'CAL. Θ · IX', 270, 44, th.brandText, '600 11px Cinzel, serif');

  // zodiac ring — two alternating tones, current sign glowing
  ctx.save();
  ctx.translate(CX, CY);
  const ringInner = R_MAX + 6, ringOuter = R_MAX + 30;

  for (let i = 0; i < 12; i++) {
    const a0 = deg2rad(i * 30), a1 = deg2rad(i * 30 + 30);
    const isCurrent = i === sunSignIndex;
    ctx.beginPath();
    ctx.arc(0, 0, ringOuter, -a0, -a1, true);
    ctx.arc(0, 0, ringInner, -a1, -a0, false);
    ctx.closePath();
    ctx.fillStyle = isCurrent ? th.currentFill : th.zodiacAlt[i % 2];
    ctx.fill();
    if (isCurrent) {
      ctx.save();
      ctx.shadowColor = th.currentGlow;
      ctx.shadowBlur = 16;
      ctx.strokeStyle = th.currentGlow;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.strokeStyle = th.metalDark;
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, ringOuter, 0, 2 * Math.PI); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, ringInner, 0, 2 * Math.PI); ctx.stroke();

  ctx.font = '22px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < 12; i++) {
    const mid = deg2rad(i * 30 + 15);
    const lx = Math.cos(mid) * (R_MAX + 18), ly = -Math.sin(mid) * (R_MAX + 18);
    ctx.fillStyle = i === sunSignIndex ? th.glyphCurrent : th.glyphDefault;
    ctx.fillText(ZODIAC[i][0], lx, ly);
    ctx.beginPath();
    const a = deg2rad(i * 30);
    ctx.strokeStyle = th.metalDark;
    ctx.lineWidth = 1;
    ctx.moveTo(Math.cos(a) * ringInner, -Math.sin(a) * ringInner);
    ctx.lineTo(Math.cos(a) * ringOuter, -Math.sin(a) * ringOuter);
    ctx.stroke();
  }
  // fine minute-track ticks, watch-chapter-ring style
  ctx.strokeStyle = th.fineTick;
  ctx.lineWidth = 1;
  for (let i = 0; i < 120; i++) {
    if (i % 10 === 0) continue; // skip where the 12 major ticks already fall
    const a = deg2rad(i * 3);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (ringOuter - 5), -Math.sin(a) * (ringOuter - 5));
    ctx.lineTo(Math.cos(a) * ringOuter, -Math.sin(a) * ringOuter);
    ctx.stroke();
  }

  // solstice/equinox marks at the four cardinal points of the Sun's
  // ecliptic longitude (0/90/180/270 -- the same value sunSignIndex already
  // uses), color-coded by season -- no labels, just a colored tick.
  [
    { lon: 0, color: '#e8a5c4' },   // spring equinox -- pink
    { lon: 90, color: '#7fbf7f' },  // summer solstice -- green
    { lon: 180, color: '#e0c14a' }, // fall equinox -- yellow
    { lon: 270, color: '#53565a' }, // winter solstice -- gunmetal grey
  ].forEach(({ lon, color }) => {
    const a = deg2rad(lon);
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * (ringOuter - 4), -Math.sin(a) * (ringOuter - 4));
    ctx.lineTo(Math.cos(a) * (ringOuter + 10), -Math.sin(a) * (ringOuter + 10));
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.5;
    ctx.stroke();
  });

  ctx.restore();

  if (skyViewActive) {
    drawSkyView(ctx, CX, CY, JD, positions, earth, th);
  } else {
  // orbit rings (static, based on mean semi-major axis)
  ctx.save();
  ctx.translate(CX, CY);
  PLANETS.forEach(p => {
    const rr = scaleR(positions[p.name].a);
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, 2 * Math.PI);
    ctx.strokeStyle = th.orbitRing;
    ctx.lineWidth = 1;
    ctx.stroke();
  });
  ctx.restore();

  // sun hub — jeweled cap with regulator-style corner screws
  ctx.save();
  ctx.translate(CX, CY);
  ctx.beginPath(); ctx.arc(0, 0, 24, 0, 2 * Math.PI);
  ctx.strokeStyle = th.metalMid; ctx.lineWidth = 1.5; ctx.stroke();
  [0, 90, 180, 270].forEach(deg => {
    const a = deg2rad(deg);
    const sx = Math.cos(a) * 24, sy = Math.sin(a) * 24;
    ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, 2 * Math.PI);
    ctx.fillStyle = th.metalDeepest; ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx - 1.6, sy); ctx.lineTo(sx + 1.6, sy);
    ctx.strokeStyle = th.metalMid; ctx.lineWidth = 0.6; ctx.stroke();
  });
  const sunGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
  sunGrad.addColorStop(0, '#fff3c9');
  sunGrad.addColorStop(1, '#c46a3a');
  ctx.beginPath(); ctx.arc(0, 0, 16, 0, 2 * Math.PI);
  ctx.fillStyle = sunGrad;
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.strokeStyle = th.metalMid; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(-5, -5, 3, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.fill();
  ctx.restore();

  // Sun pointer on the zodiac ring (sunGeoLon computed at top of render)
  ctx.save();
  ctx.translate(CX, CY);
  const sa = deg2rad(sunGeoLon);
  ctx.strokeStyle = th.accentHand; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(Math.cos(sa) * (R_MAX + 30), -Math.sin(sa) * (R_MAX + 30));
  ctx.lineTo(Math.cos(sa) * (R_MAX + 60), -Math.sin(sa) * (R_MAX + 60));
  ctx.stroke();
  ctx.fillStyle = th.accentHand;
  ctx.font = 'bold 13px serif'; ctx.textAlign = 'center';
  ctx.fillText('☉', Math.cos(sa) * (R_MAX + 76), -Math.sin(sa) * (R_MAX + 76) + 4);
  ctx.restore();

  // planets
  ctx.save();
  ctx.translate(CX, CY);
  PLANETS.forEach(p => {
    const pos = positions[p.name];
    const rr = scaleR(pos.r);
    const a = deg2rad(pos.lon);
    const x = Math.cos(a) * rr, y = -Math.sin(a) * rr;

    ctx.beginPath();
    ctx.arc(x, y, p.name === selected ? 11 : 8, 0, 2 * Math.PI);
    ctx.fillStyle = p.color;
    ctx.fill();
    ctx.strokeStyle = p.name === selected ? th.selectedStroke : th.defaultStroke;
    ctx.lineWidth = p.name === selected ? 2.5 : 1.5;
    ctx.stroke();

    ctx.fillStyle = '#ece2c4';
    ctx.font = '11px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.symbol, x, y + 0.5);

    p._screen = { x: x + CX, y: y + CY };
  });
  ctx.restore();

  drawGalileanStrip(ctx, CX, CY, positions['Jupiter'], JD, th);
  }

  // complications — mounted on a scalloped shield plate that hugs the
  // dial's own case curve (drawn on this same canvas so the seam is
  // pixel-exact), each sitting in its own lobe: Metonic (right), Moon
  // Phase (middle, largest), Day-Date (left), each placed radially out
  // from the case along its lobe's own angle.
  drawShieldPlate(ctx, CX, CY, th);

  const moonPhase = moonPhaseAt(currentDate);
  const eclipseType = eclipseTypeAt(currentDate, sunGeoLon);

  const metonicYear = ((currentDate.getFullYear() - 2000) % 19 + 19) % 19 + 1;

  const startOfYear = new Date(currentDate.getFullYear(), 0, 1).getTime();
  const daysInYear = (new Date(currentDate.getFullYear() + 1, 0, 1).getTime() - startOfYear) / 86400000;
  const dayOfYear = Math.floor((new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime() - startOfYear) / 86400000) + 1;

  const MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const dateStr = `${String(currentDate.getDate()).padStart(2, '0')} ${MONTH_ABBR[currentDate.getMonth()]}`;
  const WEEKDAY_ABBR = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const weekday = WEEKDAY_ABBR[currentDate.getDay()];

  function lobeCenter(phiDeg, r) {
    const placementR = R_MAX + 76 + r + 6 + 10; // case radius + bezel + small gap
    const p = deg2rad(phiDeg);
    return { x: CX + Math.cos(p) * placementR, y: CY + Math.sin(p) * placementR };
  }

  const moonR = 76;
  const moonPos = lobeCenter(90, moonR);

  drawMetonicDial(ctx, CX, CY, metonicYear, th);
  drawMoonPhase(ctx, moonPos.x, moonPos.y, moonR, moonPhase, th);
  drawDayDateDial(ctx, CX, CY, weekday, dateStr, currentDate.getFullYear(), th);

  if (eclipseType) {
    ctx.save();
    ctx.translate(moonPos.x, moonPos.y);
    ctx.beginPath();
    ctx.arc(0, 0, moonR + 11, 0, 2 * Math.PI);
    ctx.strokeStyle = eclipseType === 'solar' ? '#c46a3a' : '#8a5fd1';
    ctx.lineWidth = 2.5;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.shadowBlur = 14;
    ctx.stroke();
    ctx.restore();
  }

  const weekdayTitle = weekday[0] + weekday.slice(1).toLowerCase();
  const monthTitle = MONTH_ABBR[currentDate.getMonth()][0] + MONTH_ABBR[currentDate.getMonth()].slice(1).toLowerCase();
  readout.textContent = `${weekdayTitle}, ${String(currentDate.getDate()).padStart(2, '0')} ${monthTitle} ${currentDate.getFullYear()}` + `  ·  ${zodiacSign(sunGeoLon)}`;
  const eclipseNote = eclipseType ? ` · ⚠ ${eclipseType === 'solar' ? 'Solar' : 'Lunar'} eclipse likely` : '';
  almanacLine.textContent = skyViewActive && observerLoc
    ? `Sky View · ${observerLoc.lat.toFixed(1)}°, ${observerLoc.lon.toFixed(1)}° · drag to look around, scroll to zoom, double-click to reset`
    : `${moonPhaseLabel(moonPhase)} · Metonic year ${metonicYear}/19 · Day ${dayOfYear}/${daysInYear}${eclipseNote}`;
  dial.setAttribute('aria-label', `Orrery dial for ${readout.textContent}. ${almanacLine.textContent}.`);

  renderList(positions);
  if (selected) renderDetail(selected, positions);
}

function moonPhaseLabel(p) {
  if (p < 0.02 || p > 0.98) return 'New Moon';
  if (p < 0.24) return 'Waxing Crescent';
  if (p < 0.27) return 'First Quarter';
  if (p < 0.49) return 'Waxing Gibbous';
  if (p < 0.52) return 'Full Moon';
  if (p < 0.74) return 'Waning Gibbous';
  if (p < 0.77) return 'Last Quarter';
  return 'Waning Crescent';
}

// The shield plate: a winged panel whose inner edge is the dial's own case
// circle (so there is no seam — the wings taper to nothing exactly at the
// case) sweeping up either side toward the dial's horizontal diameter, then
// thickening as it curves down to the belly that holds the complications —
// after the swept shield panel on a classic jump-hour watch.
const SHIELD_TIP_DEG = 20; // how far up either side the wings climb (0=diameter) — pulled in from 15 for a smaller footprint

// A flat-topped ziggurat, mirror-symmetric about the bottom pole (90), with
// five distinct plateaus per side instead of three: flush wingtip -> a bare
// "shoulder" step -> the Metonic/Day-Date tier -> a bare "rise" step -> the
// Moon tier at the peak. The bare shoulder/rise steps exist purely to add
// more visible stair-stepping between the named complications; only the
// Metonic/Moon/Day-Date tiers need to be tall enough to actually frame their
// dial. Overall peak height is lower than before, for a smaller plate.
const SHIELD_STEPS = [
  [33, 0],     // flush with the case out to here
  [44, 55],    // shoulder
  [59, 160],   // Metonic plateau
  [72, 180],   // rise
  [108, 200],  // Moon plateau (peak, centered on the bottom pole)
  [121, 180],  // rise (mirrored)
  [136, 160],  // Day-Date plateau
  [147, 55],   // shoulder (mirrored)
  [180, 0],    // flush with the case from here to the far wingtip
];

function shieldBulgeAt(phiDeg) {
  for (const [upTo, level] of SHIELD_STEPS) {
    if (phiDeg < upTo) return level;
  }
  return 0;
}

function shieldOuterRadius(phiDeg) {
  return R_MAX + 76 + shieldBulgeAt(phiDeg);
}

function drawShieldPlate(c, cx, cy, th) {
  const Rcase = R_MAX + 76;
  c.save();
  c.translate(cx, cy);

  c.beginPath();
  // inner edge: the case circle itself, wing tip to wing tip through the bottom pole
  c.arc(0, 0, Rcase, deg2rad(180 - SHIELD_TIP_DEG), deg2rad(SHIELD_TIP_DEG), true);
  // outer edge: swept back across, flattening into a plateau across the belly
  for (let phi = SHIELD_TIP_DEG; phi <= 180 - SHIELD_TIP_DEG + 0.01; phi += 1.5) {
    const R = shieldOuterRadius(phi);
    const p = deg2rad(phi);
    c.lineTo(Math.cos(p) * R, Math.sin(p) * R);
  }
  c.closePath();

  const tipY = Math.sin(deg2rad(SHIELD_TIP_DEG)) * Rcase;
  const grad = c.createLinearGradient(0, tipY, 0, shieldOuterRadius(90));
  grad.addColorStop(0, th.caseGradStops[0]);
  grad.addColorStop(0.55, th.caseGradStops[1]);
  grad.addColorStop(1, th.caseGradStops[2]);
  c.fillStyle = grad;
  c.fill();
  // Stroke the outline now, while this path is still the canvas's current
  // path -- brushFlat() below calls beginPath() internally for each of its
  // streaks, and the "current path" isn't part of the state save()/restore()
  // protects, so stroking this same path AFTER brushFlat runs would silently
  // re-stroke whatever streak it happened to draw last instead (the cause of
  // a stray short line elsewhere on the plate).
  c.strokeStyle = th.metalDeepest;
  c.lineWidth = 2;
  c.stroke();
  c.save();
  c.clip(); // the path above is still current; confines the brush streaks to the shield's own silhouette
  brushFlat(c, -(Rcase + 260), tipY, (Rcase + 260) * 2, shieldOuterRadius(90) - tipY, 23);
  c.restore();

  // fluted edge — reeded ticks following the outer curve, like a coin's edge
  for (let phi = SHIELD_TIP_DEG; phi <= 180 - SHIELD_TIP_DEG; phi += 2) {
    const R = shieldOuterRadius(phi);
    const p = deg2rad(phi);
    const x = Math.cos(p) * R, y = Math.sin(p) * R;
    const p2 = deg2rad(phi + 0.6);
    const R2 = shieldOuterRadius(phi + 0.6);
    const tx = Math.cos(p2) * R2 - x, ty = Math.sin(p2) * R2 - y;
    const tlen = Math.hypot(tx, ty) || 1;
    let nx = ty / tlen, ny = -tx / tlen;
    if (nx * x + ny * y < 0) { nx = -nx; ny = -ny; } // keep the normal pointing outward
    c.beginPath();
    c.moveTo(x - nx * 9, y - ny * 9);
    c.lineTo(x + nx * 1.5, y + ny * 1.5);
    c.strokeStyle = (Math.round(phi / 2)) % 2 === 0 ? th.fluteDark : th.fluteLight;
    c.lineWidth = 1.3;
    c.stroke();
  }

  // a fine inset outline, a hair inside the flutes, for a rimmed/machined look
  c.beginPath();
  for (let phi = SHIELD_TIP_DEG + 3; phi <= 180 - SHIELD_TIP_DEG - 3; phi += 2) {
    const R = shieldOuterRadius(phi) - 11;
    const p = deg2rad(phi);
    const x = Math.cos(p) * R, y = Math.sin(p) * R;
    if (phi === SHIELD_TIP_DEG + 3) c.moveTo(x, y); else c.lineTo(x, y);
  }
  c.strokeStyle = th.metalDeepest;
  c.lineWidth = 1;
  c.globalAlpha = 0.5;
  c.stroke();
  c.globalAlpha = 1;

  // rivets at the two wing tips, echoing the sun hub's screws
  [SHIELD_TIP_DEG, 180 - SHIELD_TIP_DEG].forEach(phiDeg => {
    const p = deg2rad(phiDeg);
    const sx = Math.cos(p) * Rcase, sy = Math.sin(p) * Rcase;
    c.beginPath(); c.arc(sx, sy, 3, 0, 2 * Math.PI);
    c.fillStyle = th.metalDeepest; c.fill();
    c.beginPath(); c.arc(sx - 1, sy - 1, 1, 0, 2 * Math.PI);
    c.fillStyle = 'rgba(255,255,255,0.5)'; c.fill();
  });

  c.restore();
}

function drawComplicationBezel(c, r, th) {
  c.beginPath(); c.arc(0, 0, r + 6, 0, 2 * Math.PI);
  c.strokeStyle = th.metalBright; c.lineWidth = 2;
  c.shadowColor = 'rgba(0,0,0,0.4)'; c.shadowBlur = 4; c.shadowOffsetY = 1.5;
  c.stroke();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
  c.beginPath(); c.arc(0, 0, r + 2, 0, 2 * Math.PI);
  c.strokeStyle = th.metalMid; c.lineWidth = 1; c.stroke();
}

function drawMoonPhase(c, cx, cy, r, phase, th) {
  c.save();
  c.translate(cx, cy);

  c.beginPath(); c.arc(0, 0, r, 0, 2 * Math.PI);
  c.fillStyle = '#0e1a24'; c.fill();

  // faint fixed starfield for a night-sky moonphase face (kept dark in both themes, like a "panda dial" register)
  const stars = [[-29,-22],[18,-31],[29,6],[-16,28],[6,36],[-31,11],[22,23]];
  c.fillStyle = 'rgba(236,226,196,0.5)';
  stars.forEach(([sx, sy]) => { c.beginPath(); c.arc(sx, sy, 1, 0, 2 * Math.PI); c.fill(); });

  const theta = phase * 2 * Math.PI;
  const rx = r * Math.abs(Math.cos(theta));
  const litRight = phase < 0.5;

  c.beginPath();
  c.fillStyle = '#ece2c4';
  if (litRight) {
    c.moveTo(0, -r);
    c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);
    c.ellipse(0, 0, rx, r, 0, Math.PI / 2, -Math.PI / 2, phase < 0.25);
  } else {
    c.moveTo(0, -r);
    c.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, true);
    c.ellipse(0, 0, rx, r, 0, -Math.PI / 2, Math.PI / 2, phase > 0.75);
  }
  c.closePath(); c.fill();

  drawComplicationBezel(c, r, th);
  c.restore();
}

// A single tangent-aligned label (not spread across an arc) -- used for the
// numerals on the Metonic gauge, which are plain multi-digit numbers rather
// than the letter-by-letter arc text drawArcTextPhi is built for.
function drawTangentLabel(c, cx, cy, r, phiDeg, text, color, font) {
  const phi = deg2rad(phiDeg);
  c.save();
  c.translate(cx + Math.cos(phi) * r, cy + Math.sin(phi) * r);
  c.rotate(phi - Math.PI / 2);
  c.fillStyle = color; c.font = font; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, 0, 0);
  c.restore();
}

// The 19-year Metonic lunisolar cycle, as a curved progress band -- the
// same construction as the Day-Date band (arcs centered on the dial's own
// center, CX/CY), mirrored across the bottom pole so the two side
// complications read as a genuine symmetric pair either side of the Moon.
// MO/MI mirror the Day-Date band's AO/AI (130/110): MI, the limit nearer
// the Moon dial, mirrors AI; MO, nearer this wing's own tip, mirrors AO.
function drawMetonicDial(c, CX, CY, year, th) {
  const MO = 50, MI = 70;
  const rIn = 490, rOut = 530;

  function sector(a0Deg, a1Deg, r0, r1) {
    c.beginPath();
    c.arc(CX, CY, r1, deg2rad(a0Deg), deg2rad(a1Deg));
    c.arc(CX, CY, r0, deg2rad(a1Deg), deg2rad(a0Deg), true);
    c.closePath();
  }

  // recessed band, same treatment as the Day-Date band
  sector(MO, MI, rIn, rOut);
  c.fillStyle = 'rgba(0,0,0,0.2)'; c.fill();
  c.strokeStyle = th.metalDeepest; c.lineWidth = 1.5; c.stroke();
  sector(MO + 0.5, MI - 0.5, rIn + 2, rOut - 2);
  c.strokeStyle = 'rgba(255,255,255,0.15)'; c.lineWidth = 1; c.stroke();

  // the gauge cell itself
  sector(MO + 1, MI - 1, rIn + 4, rOut - 4);
  c.fillStyle = th.dateWindowBg; c.fill();

  // ticks/progress map onto an inset range so year 1/19 don't land right on
  // the band's own edges (and corner rivets)
  const A0 = MO + 3, A1 = MI - 3;
  const angleFor = y => A1 - ((y - 1) / 18) * (A1 - A0); // year 1 at A1, running down to year 19 at A0

  // progress track: a dim full track, with the elapsed portion lit bright
  const trackR = (rIn + rOut) / 2;
  c.beginPath(); c.arc(CX, CY, trackR, deg2rad(A0), deg2rad(A1));
  c.strokeStyle = th.metalDark; c.lineWidth = 5; c.stroke();
  c.beginPath(); c.arc(CX, CY, trackR, deg2rad(angleFor(year)), deg2rad(A1));
  c.strokeStyle = th.metalBright; c.lineWidth = 5; c.stroke();

  // tick marks + numerals at 1, 5, 10, 15, 19
  [1, 5, 10, 15, 19].forEach(y => {
    const a = deg2rad(angleFor(y));
    const x0 = CX + Math.cos(a) * (rIn + 6), y0 = CY + Math.sin(a) * (rIn + 6);
    const x1 = CX + Math.cos(a) * (rOut - 6), y1 = CY + Math.sin(a) * (rOut - 6);
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1);
    c.strokeStyle = th.metalMid; c.lineWidth = 1; c.stroke();
  });
  drawTangentLabel(c, CX, CY, rIn - 11, angleFor(1), '1', th.subdialDim, '600 10px Cinzel, serif');
  drawTangentLabel(c, CX, CY, rIn - 11, angleFor(5), '5', th.subdialDim, '600 10px Cinzel, serif');
  drawTangentLabel(c, CX, CY, rIn - 11, angleFor(10), '10', th.subdialDim, '600 10px Cinzel, serif');
  drawTangentLabel(c, CX, CY, rIn - 11, angleFor(15), '15', th.subdialDim, '600 10px Cinzel, serif');
  drawTangentLabel(c, CX, CY, rIn - 11, angleFor(19), '19', th.subdialDim, '600 10px Cinzel, serif');

  // current-year marker, echoing the old gauge's hand
  const na = deg2rad(angleFor(year));
  c.beginPath(); c.arc(CX + Math.cos(na) * trackR, CY + Math.sin(na) * trackR, 4, 0, 2 * Math.PI);
  c.fillStyle = th.accentHand; c.fill();
  c.strokeStyle = th.metalDeepest; c.lineWidth = 1; c.stroke();

  drawArcTextPhi(c, CX, CY, rOut + 11, 'METONIC CYCLE', (MO + MI) / 2, MI - MO, th.subdialDim, '11px "Cormorant Garamond", serif');

  // small rivets at the band's outer corners, matching the Day-Date band
  [MO, MI].forEach(phiDeg => {
    const p = deg2rad(phiDeg);
    const rx = CX + Math.cos(p) * (rOut - 6), ry = CY + Math.sin(p) * (rOut - 6);
    c.beginPath(); c.arc(rx, ry, 2.2, 0, 2 * Math.PI);
    c.fillStyle = th.metalDeepest; c.fill();
    c.beginPath(); c.arc(rx - 0.6, ry - 0.6, 0.8, 0, 2 * Math.PI);
    c.fillStyle = 'rgba(255,255,255,0.5)'; c.fill();
  });
}

// Text set along an arc using the shield's own angle convention (phi=90 is
// straight down, matching cos(phi)/sin(phi) throughout this section). For
// any phi between 0 and 180 -- i.e. anywhere on the shield, which sits
// entirely in the bottom half of the dial -- increasing phi moves LEFT on
// screen, so characters are placed in decreasing-phi order (first letter at
// the largest phi) to read left-to-right, and each is rotated by phi-90°
// rather than phi+90° so it lands right-side up instead of upside down.
function drawArcTextPhi(c, cx, cy, r, text, centerPhiDeg, spreadDeg, color, font) {
  c.save();
  c.font = font; c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
  const n = text.length;
  const step = n > 1 ? deg2rad(spreadDeg) / (n - 1) : 0;
  const start = deg2rad(centerPhiDeg) + (n > 1 ? deg2rad(spreadDeg) / 2 : 0);
  for (let i = 0; i < n; i++) {
    const phi = start - i * step;
    c.save();
    c.translate(cx + Math.cos(phi) * r, cy + Math.sin(phi) * r);
    c.rotate(phi - Math.PI / 2);
    c.fillText(text[i], 0, 0);
    c.restore();
  }
  c.restore();
}

// A classic "Day-Date" complication -- weekday name and calendar date --
// curved into a wide, narrow band that follows the main dial's own
// curvature (both its edges are arcs centered on the dial's own center,
// CX/CY, exactly like the case ring itself). The weekday/date divider
// intentionally lines up with the shield's own plateau riser at 121 (see
// SHIELD_STEPS); the outer limit is pulled in from the shield's next riser
// at 136 so the band doesn't run right up to that edge.
function drawDayDateDial(c, CX, CY, weekday, dateStr, year, th) {
  const AI = 110, AD = 121, AO = 130; // inner limit / weekday-date divider / outer limit -- pulled AO in from the shield's own 136 riser for clearance
  const rIn = 490, rOut = 530;

  function sector(a0Deg, a1Deg, r0, r1) {
    c.beginPath();
    c.arc(CX, CY, r1, deg2rad(a0Deg), deg2rad(a1Deg));
    c.arc(CX, CY, r0, deg2rad(a1Deg), deg2rad(a0Deg), true);
    c.closePath();
  }

  // the recessed band itself, milled along the plate's own curve
  sector(AI, AO, rIn, rOut);
  c.fillStyle = 'rgba(0,0,0,0.2)'; c.fill();
  c.strokeStyle = th.metalDeepest; c.lineWidth = 1.5; c.stroke();
  sector(AI + 0.5, AO - 0.5, rIn + 2, rOut - 2);
  c.strokeStyle = 'rgba(255,255,255,0.15)'; c.lineWidth = 1; c.stroke();

  // the two cells
  sector(AI + 1, AD - 0.5, rIn + 4, rOut - 4);
  c.fillStyle = th.dateWindowBg; c.fill();
  sector(AD + 0.5, AO - 1, rIn + 4, rOut - 4);
  c.fillStyle = th.dateWindowBg; c.fill();

  // divider between the cells, on the shield's own riser angle
  const dp = deg2rad(AD);
  c.beginPath();
  c.moveTo(CX + Math.cos(dp) * (rIn + 3), CY + Math.sin(dp) * (rIn + 3));
  c.lineTo(CX + Math.cos(dp) * (rOut - 3), CY + Math.sin(dp) * (rOut - 3));
  c.strokeStyle = th.metalDeepest; c.lineWidth = 1; c.stroke();

  const midR = (rIn + rOut) / 2;
  drawArcTextPhi(c, CX, CY, midR, weekday, (AI + AD) / 2, (AD - AI) * 0.68, th.dateWindowText, '600 13px Cinzel, serif');
  drawArcTextPhi(c, CX, CY, midR, dateStr, (AD + AO) / 2, (AO - AD) * 0.72, th.dateWindowText, '600 12px Cinzel, serif');

  drawArcTextPhi(c, CX, CY, rOut + 11, 'DAY' + '  ' + 'DATE', (AI + AO) / 2, AO - AI, th.subdialDim, '11px "Cormorant Garamond", serif');
  drawArcTextPhi(c, CX, CY, rIn - 11, 'A.D. ' + year, (AI + AO) / 2, (AO - AI) * 0.55, th.subdialDim, '10px "Cormorant Garamond", serif');

  // small rivets at the band's outer corners, echoing the shield's own rivets
  [AI, AO].forEach(phiDeg => {
    const p = deg2rad(phiDeg);
    const rx = CX + Math.cos(p) * (rOut - 6), ry = CY + Math.sin(p) * (rOut - 6);
    c.beginPath(); c.arc(rx, ry, 2.2, 0, 2 * Math.PI);
    c.fillStyle = th.metalDeepest; c.fill();
    c.beginPath(); c.arc(rx - 0.6, ry - 0.6, 0.8, 0, 2 * Math.PI);
    c.fillStyle = 'rgba(255,255,255,0.5)'; c.fill();
  });
}

function isRetrograde(p, T) {
  if (p.name === 'Earth') return false;
  const dT = 1 / 36525;
  const posNow = heliocentric(p, T);
  const posPrev = heliocentric(p, T - dT);
  const earthNow = heliocentric(PLANETS.find(x => x.name === 'Earth'), T);
  const earthPrev = heliocentric(PLANETS.find(x => x.name === 'Earth'), T - dT);
  const geoNow = normDeg(rad2deg(Math.atan2(posNow.y - earthNow.y, posNow.x - earthNow.x)));
  const geoPrev = normDeg(rad2deg(Math.atan2(posPrev.y - earthPrev.y, posPrev.x - earthPrev.x)));
  let diff = normDeg(geoNow - geoPrev + 180) - 180;
  return diff < 0;
}

function renderList(positions) {
  const JD = toJulianDate(currentDate);
  const T = (JD - 2451545.0) / 36525;
  const earth = positions['Earth'];
  planetList.innerHTML = '';
  PLANETS.forEach(p => {
    const pos = positions[p.name];
    const geoLon = p.name === 'Earth' ? normDeg(earth.lon + 180) : normDeg(rad2deg(Math.atan2(pos.y - earth.y, pos.x - earth.x)));
    const rx = isRetrograde(p, T);
    const row = document.createElement('div');
    row.className = 'planet-row' + (p.name === selected ? ' active' : '');
    row.innerHTML = `
      <div class="p-glyph" style="color:${p.color};border-color:${p.color}55">${p.symbol}</div>
      <div class="p-info">
        <div class="p-name">${p.name}${rx ? '<span class="p-rx">℞ Rx</span>' : ''}</div>
        <div class="p-meta">${pos.r.toFixed(2)} AU from Sun · ${zodiacSign(geoLon)}</div>
      </div>`;
    row.addEventListener('click', () => { selected = p.name; render(); });
    planetList.appendChild(row);
  });
}

function renderDetail(name, positions) {
  const p = PLANETS.find(x => x.name === name);
  const pos = positions[name];
  const earth = positions['Earth'];
  const distEarth = Math.sqrt((pos.x - earth.x) ** 2 + (pos.y - earth.y) ** 2 + (pos.z - earth.z) ** 2);
  const geoLon = name === 'Earth' ? normDeg(earth.lon + 180) : normDeg(rad2deg(Math.atan2(pos.y - earth.y, pos.x - earth.x)));
  const JD = toJulianDate(currentDate);
  const T = (JD - 2451545.0) / 36525;
  const rx = isRetrograde(p, T);
  detailPanel.innerHTML = `
    <h3>${p.symbol} ${p.name}</h3>
    <div>Distance from Sun: ${pos.r.toFixed(3)} AU</div>
    <div>${name === 'Earth' ? 'You are here' : `Distance from Earth: ${distEarth.toFixed(3)} AU`}</div>
    <div>Orbital period: ${pos.periodYears.toFixed(2)} years (${Math.round(pos.periodYears * 365.25).toLocaleString()} days)</div>
    <div>Eccentricity: ${pos.e.toFixed(3)}</div>
    <div>Zodiac (geocentric): ${zodiacSign(geoLon)}</div>
    ${rx ? '<div style="color:#d1583f">℞ Currently in apparent retrograde</div>' : ''}
  `;
}

dial.addEventListener('click', e => {
  if (skyViewActive) return; // dragging the sky view stands in for planet-picking here
  const rect = dial.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (LOGICAL_W / rect.width);
  const my = (e.clientY - rect.top) * (LOGICAL_H / rect.height);
  let best = null, bestD = 22;
  PLANETS.forEach(p => {
    if (!p._screen) return;
    const d = Math.hypot(mx - p._screen.x, my - p._screen.y);
    if (d < bestD) { bestD = d; best = p.name; }
  });
  if (best) { selected = best; render(); }
});

// ─────────────────────────────────────────────────────────────────────────
// Sky View: location, and drag-to-pan / wheel-to-zoom on the dome
// ─────────────────────────────────────────────────────────────────────────
function ensureLocation(onReady) {
  if (observerLoc) { onReady(); return; }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        observerLoc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
        localStorage.setItem('antikythera-location', JSON.stringify(observerLoc));
        onReady();
      },
      () => { promptForLocation(onReady); },
      { timeout: 8000 }
    );
  } else {
    promptForLocation(onReady);
  }
}

function promptForLocation(onReady) {
  const input = prompt('Could not use your device location. Enter your latitude and longitude as "lat, lon" (e.g. 40.7, -74.0):', '0, 0');
  if (input === null) return;
  const parts = input.split(',').map(s => parseFloat(s.trim()));
  if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
    observerLoc = { lat: parts[0], lon: parts[1] };
    localStorage.setItem('antikythera-location', JSON.stringify(observerLoc));
    onReady();
  } else {
    alert('Could not read that as "lat, lon". Sky View needs a location to know what is above your horizon.');
  }
}

const skyViewToggleBtn = document.getElementById('sky-view-toggle');
skyViewToggleBtn.addEventListener('click', () => {
  if (skyViewActive) {
    skyViewActive = false;
    skyViewToggleBtn.classList.remove('active');
    skyViewToggleBtn.textContent = 'Sky View';
    render();
  } else {
    ensureLocation(() => {
      if (!observerLoc) return;
      skyViewActive = true;
      skyViewToggleBtn.classList.add('active');
      skyViewToggleBtn.textContent = 'Orrery View';
      render();
    });
  }
});

let skyDrag = null;
dial.addEventListener('pointerdown', e => {
  if (!skyViewActive) return;
  skyDrag = { x: e.clientX, y: e.clientY, az: skyView.centerAz, alt: skyView.centerAlt };
  dial.setPointerCapture(e.pointerId);
});
dial.addEventListener('pointermove', e => {
  if (!skyViewActive || !skyDrag) return;
  const rect = dial.getBoundingClientRect();
  const pxPerLogical = rect.width / LOGICAL_W;
  const dx = (e.clientX - skyDrag.x) / pxPerLogical;
  const dy = (e.clientY - skyDrag.y) / pxPerLogical;
  const degPerLogicalPx = (90 / R_MAX) / skyView.zoom;
  skyView.centerAz = normDeg(skyDrag.az - dx * degPerLogicalPx);
  skyView.centerAlt = Math.max(-15, Math.min(90, skyDrag.alt + dy * degPerLogicalPx));
  render();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(evt => {
  dial.addEventListener(evt, () => { skyDrag = null; });
});
dial.addEventListener('dblclick', e => {
  if (!skyViewActive) return;
  skyView.zoom = 1; skyView.centerAz = 0; skyView.centerAlt = 90;
  render();
});
dial.addEventListener('wheel', e => {
  if (!skyViewActive) return;
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.001);
  skyView.zoom = Math.max(1, Math.min(8, skyView.zoom * factor));
  render();
}, { passive: false });

setDate(new Date());
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support just won't be available */ });
  });
}
</script>
